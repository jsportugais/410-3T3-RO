title: Atelier de présentation orale
description: 410-3T3-RO — Techniques d’administration et de gestion, Cégep de Rosemont
lang: fr-CA

# Thème distant, construit par GitHub Pages. Aucune dépendance locale.
# La version est épinglée : la documentation correspondante se trouve dans
# C:\Users\jeans\Sites\documentation-just-the-docs\
remote_theme: just-the-docs/just-the-docs@v0.12.0

# Jeu de couleurs du Cégep, défini dans _sass/color_schemes/rosemont.scss
color_scheme: rosemont

# Liens auxiliaires — bande supérieure droite, sur toutes les pages.
# L'intitulé est la clé ; sa valeur est une liste, d'où le tiret même pour une
# seule adresse.
#
# Omnivox porte Léa, qui demeure le canal officiel du cours. Le lien est présent
# sur chaque page pour qu'on y revienne de n'importe où, ce qui prolonge
# l'avertissement de la page d'accueil.
#
# L'adresse est celle de la racine du portail, et non celle du formulaire de
# connexion : elle mène au même endroit et résiste à une refonte d'Omnivox.
#
# Le lien s'ouvre dans un nouvel onglet, pour que le site du cours reste ouvert
# derrière.
aux_links:
  Omnivox:
    - "https://crosemont.omnivox.ca/"
aux_links_new_tab: true

# Tout fichier .md du dépôt reçoit le gabarit du thème sans avoir à le déclarer.
# Un fichier copié ici n'a donc besoin que de son titre en en-tête.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Les séances et les évaluations sont des pages ordinaires réunies sous des
# pages parentes.
relative_links:
  enabled: true

# Encadrés. Sans cette section, aucun encadré n'existe.
# Deux seulement : le rouge identitaire et un neutre. Le design system interdit
# de faire cohabiter plusieurs couleurs secondaires sur un même support.
callouts:
  rappel:
    title: Rappel
    color: grey-dk
  attention:
    title: Attention
    color: red

exclude:
  - README.md
